<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapis de Souris XL | Wyvern E-sport</title>
    <meta name="description" content="Découvrez le tapis de souris esport XL officiel Wyvern Speed.">
    <meta name="author" content="Mathis ALLEWEIRELDT">
    <link rel="icon" type="image/png" href="Assets/images/logowyvern.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="Styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script type="module" src="JavaScript/scripts.js" defer></script>
    <script type="module" src="JavaScript/produit.js" defer></script>
    <script type="module" src="JavaScript/checkout.js" defer></script>
</head>
<body>

    <!-- Header Supérieur Fixe -->
    <header class="transparent-header"></header>

    <main>
        <section class="product-showcase">
            
            <!-- Galerie photo / Placeholder -->
            <div class="product-image-box">
                <div class="product-placeholder-square" style="min-height: 380px;">
                    <i class="fas fa-image"></i>
                    <span>Insérer Image Produit</span>
                </div>
            </div>

            <!-- Détails du produit -->
            <div class="product-info-box">
                <a href="shop.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Retour à la boutique
                </a>
                
                <h1 id="product-title" class="product-main-title">Tapis de Souris XL Wyvern Speed</h1>
                <span id="product-price" class="product-main-price">29.99€</span>
                
                <p id="product-description" class="product-desc">
                    Tapis de souris esport grand format (900x400mm). Surface textile micro-tissée pour une glisse fluide et réactive des capteurs optiques, base en caoutchouc antidérapant et coutures renforcées anti-effilochement.
                </p>
                
                <div class="size-selector-group">
                    <label for="size" id="size-label" class="size-label">Format :</label>
                    <select id="size" name="size" class="custom-select">
                        <option value="Unique" selected>XXL (900x400mm)</option>
                    </select>
                </div>
                
                <button class="add-to-cart big-cart-btn" 
                        data-id="Tapis de Souris XL"
                        data-product="Tapis de Souris XL Wyvern Speed" 
                        data-price="29.99" 
                        id="add-to-cart-btn">
                    <i class="fas fa-shopping-cart"></i> 
                    <span id="add-to-cart-text">Ajouter au panier</span>
                </button>
            </div>

        </section>
    </main>

    <!-- Conteneurs dynamiques -->
    <div id="navbar-container"></div>
    <div id="modal-settings"></div>
    <div id="cart-modal"></div>

</body>
</html>
