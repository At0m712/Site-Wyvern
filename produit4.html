<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche 911 GT3 RS | Wyvern E-sport</title>
    <meta name="description" content="Découvrez la Porsche 911 GT3 RS édition exclusive Wyvern E-sport.">
    <meta name="author" content="Mathis ALLEWEIRELDT">
    <link rel="icon" type="image/png" href="Assets/images/logowyvern.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="Styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script type="module" src="JavaScript/scripts.js" defer></script>
    <script type="module" src="JavaScript/produit.js" defer></script>
    <script type="module" src="JavaScript/checkout.js" defer></script>
</head>
<body>

    <!-- Header Supérieur Fixe -->
    <header class="transparent-header"></header>

    <main>
        <section class="product-showcase">
            
            <!-- Galerie photo -->
            <div class="product-image-box">
                <img src="Assets/Produit/Porsche911GT3Rs.png" class="prod-img active" alt="Porsche 911 GT3 RS Wyvern">
            </div>

            <!-- Détails du produit -->
            <div class="product-info-box">
                <a href="shop.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Retour à la boutique
                </a>
                
                <h1 id="product-title" class="product-main-title">Porsche 911 GT3 RS</h1>
                <span id="product-price" class="product-main-price">9 000 000€</span>
                
                <p id="product-description" class="product-desc">
                    L'incarnation suprême de la précision sur circuit. Aérodynamique active issue du sport automobile, 
                    moteur atmosphérique rageur et livrée Wyvern Performance pour dominer l'asphalte virtuel et réel.
                </p>
                
                <div class="size-selector-group">
                    <label for="size" id="size-label" class="size-label">Modèle :</label>
                    <select id="size" name="size" class="custom-select">
                        <option value="Unique" selected>Édition Collector GT3 RS</option>
                    </select>
                </div>
                
                <button class="add-to-cart big-cart-btn" 
                        data-id="Porsche 911"
                        data-product="Porsche 911 GT3 RS" 
                        data-price="9000000" 
                        id="add-to-cart-btn">
                    <i class="fas fa-shopping-cart"></i> 
                    <span id="add-to-cart-text">Ajouter au panier</span>
                </button>
            </div>

        </section>
    </main>

    <!-- Conteneurs dynamiques -->
    <div id="navbar-container"></div>
    <div id="modal-settings"></div>
    <div id="cart-modal"></div>

</body>
</html>
