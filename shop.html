<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Officielle | Wyvern E-sport</title>
    <meta name="description" content="Boutique officielle de Wyvern E-sport - Maillots officiels, vestes, hoodies et accessoires esport.">
    <meta name="author" content="Mathis ALLEWEIRELDT">
    <link rel="icon" type="image/png" href="Assets/images/logowyvern.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="Styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<body>

    <!-- Header Supérieur Fixe -->

    <main>
        <div class="shop-hero">

        <section id="shop">
            <div class="shop-grid" id="shop-container">

            </div>
        </section>

    <!-- Conteneurs dynamiques -->
    <div id="navbar-container"></div>
    <div id="modal-settings"></div>
    <div id="cart-modal"></div>

</html>
